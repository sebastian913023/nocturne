name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nocturne
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env for boot check
        run: |
          cp .env.example .env
          SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
          sed -i "s/SESSION_SECRET=change-me-to-a-long-random-string/SESSION_SECRET=$SECRET/" .env
          sed -i "s|^DATABASE_URL=.*|DATABASE_URL=postgresql://postgres:postgres@localhost:5432/nocturne|" .env

      - name: Run scripts/test.sh
        run: bash scripts/test.sh
